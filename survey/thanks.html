<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thanks! — Stevo</title>
<link rel="icon" href="/survey/stevo-logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0b0d12;color:#eef1f7;font-family:'Inter',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:520px;text-align:center;background:#141720;border:1px solid #262b3a;border-radius:24px;padding:52px 36px}
  .check{width:74px;height:74px;border-radius:50%;background:rgba(47,213,117,.12);border:2px solid #2fd575;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:34px}
  h1{font-family:'Chakra Petch',sans-serif;font-size:28px;margin-bottom:12px}
  p{color:#9aa3b5;font-size:15.5px;line-height:1.6}
  .logo{width:40px;height:40px;border-radius:10px;margin-top:32px}
</style>
</head>
<body>
  <div class="card">
    <div class="check">✅</div>
    <h1>You're the real MVP</h1>
    <p>Your picks are in. This genuinely helps us build a better app — when Stevo launches, you can say you called the home screen.</p>
    <img class="logo" src="/survey/stevo-logo.png" alt="Stevo logo">
  </div>
</body>
</html>
