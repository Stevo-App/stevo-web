<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Stevo | That page isn't here</title>
<!-- stevoapp.com's not-found page (audit of 2026-11-01, finding 3). Cloudflare Pages
     serves a root 404.html with a 404 status for any path that has no file; without
     one it answers every unknown URL with the home page and a 200, which is what the
     audit saw. Same shell as web/get.html: the lock-up, one line, two links. -->
<meta name="description" content="That page isn't on stevoapp.com. The home page and the FAQ are one tap away.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#06132E">
<link rel="icon" href="/stevo-coin.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Electric Sapphire, the same tokens as web/index.html (constants/theme.ts). */
  :root {
    --bg: #06132E;
    --gold500: #F3C744;
    --text: #FFFFFF;
    --soft: #E3EEFB;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow-x: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    text-align: center;
    position: relative;
    overflow-x: hidden;
  }
  /* The home page's corner glow: brightest top-left, deep navy by the middle. */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(ellipse 900px 680px at 0% 0%,
        #2496FC 0%, #0869E4 22%, #0150C8 36%, #003A9D 52%,
        #002C78 66%, #011F54 82%, rgba(6,19,46,0) 100%),
      radial-gradient(ellipse 700px 520px at 100% 70%, rgba(8,105,228,0.28), rgba(6,19,46,0) 70%);
    pointer-events: none;
  }
  a:focus-visible { outline: 2px solid var(--gold500); outline-offset: 4px; border-radius: 8px; }

  main { max-width: 440px; }
  .logo { display: inline-block; text-decoration: none; }
  .logo img { display: block; width: min(300px, 78vw); height: auto; filter: drop-shadow(0 10px 28px rgba(2,8,22,0.45)); }
  .code {
    margin-top: 26px;
    color: var(--gold500);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
  }
  h1 {
    margin-top: 10px;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.2;
    text-wrap: balance;
  }
  .line {
    margin-top: 14px;
    color: var(--soft);
    font-size: 18px;
    font-weight: 500;
    line-height: 1.5;
    text-wrap: balance;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 30px;
  }
  .links a {
    display: inline-flex;
    align-items: center;
    padding: 11px 20px;
    border: 1px solid rgba(243,199,68,0.45);
    border-radius: 999px;
    background: rgba(2,27,76,0.78);
    color: var(--gold500);
    font-size: 15px;
    font-weight: 700;
    text-decoration: none;
  }
  .links a.primary { background: var(--gold500); color: #06132E; border-color: var(--gold500); }
  @media (max-width: 380px) { h1 { font-size: 26px; } .line { font-size: 16px; } }
</style>
</head>
<body>
<main>
  <a class="logo" href="/">
    <img src="/stevo-horizontal-color-white-text.svg" width="300" height="89" alt="Stevo">
  </a>
  <p class="code">404</p>
  <h1>That page isn't here.</h1>
  <p class="line">The link may be old or mistyped. Everything about Stevo is on the home page and in the FAQ.</p>
  <p class="links">
    <a class="primary" href="/">Go to the home page</a>
    <a href="/faq">Read the FAQ</a>
  </p>
</main>
</body>
</html>
